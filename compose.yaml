name: hivepanel

services:
  panel:
    image: ${HIVEPANEL_IMAGE:-ghcr.io/hivedevelopment/hivepanel}:${HIVEPANEL_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - panel-storage:/var/www/html/storage
    networks:
      - hivepanel

  queue:
    image: ${HIVEPANEL_IMAGE:-ghcr.io/hivedevelopment/hivepanel}:${HIVEPANEL_VERSION:-latest}
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - panel-storage:/var/www/html/storage
    networks:
      - hivepanel

  scheduler:
    image: ${HIVEPANEL_IMAGE:-ghcr.io/hivedevelopment/hivepanel}:${HIVEPANEL_VERSION:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - panel-storage:/var/www/html/storage
    networks:
      - hivepanel

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - panel
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/entrypoint.sh:/docker-entrypoint.d/90-hivepanel.sh:ro
      - panel-public:/var/www/html/public:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - hivepanel

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - hivepanel

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - hivepanel

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - hivepanel

networks:
  hivepanel:
    driver: bridge

volumes:
  panel-storage:
  panel-public:
  mariadb-data:
  redis-data:
  certbot-webroot:
  letsencrypt: