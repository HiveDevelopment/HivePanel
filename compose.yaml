name: hivepanel

x-hivepanel-app: &hivepanel-app
    build:
        context: .
        target: app
    image: hivepanel/app:${HIVEPANEL_VERSION:-local}
    env_file:
        - .env
    restart: unless-stopped
    networks:
        - backend
    volumes:
        - panel-storage:/var/www/html/storage
    depends_on:
        mariadb:
            condition: service_healthy
        certbot:
        image: certbot/certbot:latest
        profiles: ["tools"]
        volumes:
            - certbot-web:/var/www/certbot
            - letsencrypt:/etc/letsencrypt

    certbot-renew:
        image: certbot/certbot:latest
        restart: unless-stopped
        entrypoint: ["/bin/sh", "-c"]
        command: ["while :; do certbot renew --webroot --webroot-path /var/www/certbot --quiet; sleep 12h; done"]
        volumes:
            - certbot-web:/var/www/certbot
            - letsencrypt:/etc/letsencrypt

    redis:
            condition: service_healthy

services:
    nginx:
        build:
            context: .
            target: nginx
        image: hivepanel/nginx:${HIVEPANEL_VERSION:-local}
        restart: unless-stopped
        environment:
            HIVEPANEL_DOMAIN: ${HIVEPANEL_DOMAIN:-_}
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - certbot-web:/var/www/certbot:ro
            - letsencrypt:/etc/letsencrypt:ro
            - panel-storage:/var/www/html/storage:ro
        networks:
            - backend
        depends_on:
            panel:
                condition: service_healthy

    panel:
        <<: *hivepanel-app
        healthcheck:
            test: ["CMD", "hivepanel-healthcheck"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s

    queue:
        <<: *hivepanel-app
        command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
        stop_grace_period: 2m

    scheduler:
        <<: *hivepanel-app
        command: ["php", "artisan", "schedule:work"]

    mariadb:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        networks:
            - backend
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 20s

    certbot:
        image: certbot/certbot:latest
        profiles: ["tools"]
        volumes:
            - certbot-web:/var/www/certbot
            - letsencrypt:/etc/letsencrypt

    certbot-renew:
        image: certbot/certbot:latest
        restart: unless-stopped
        entrypoint: ["/bin/sh", "-c"]
        command: ["while :; do certbot renew --webroot --webroot-path /var/www/certbot --quiet; sleep 12h; done"]
        volumes:
            - certbot-web:/var/www/certbot
            - letsencrypt:/etc/letsencrypt

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
        networks:
            - backend
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
            interval: 10s
            timeout: 5s
            retries: 10
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}

networks:
    backend:
        driver: bridge

volumes:
    panel-storage:
    mariadb-data:
    redis-data:
    certbot-web:
    letsencrypt:
